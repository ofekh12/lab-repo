name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ./app
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/exco-app:${{ github.sha }}

    - name: Update Kubernetes Manifest
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        sed -i 's|image: .*exco-app:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/exco-app:${{ github.sha }}|' k8s/deployment.yaml
        git add k8s/deployment.yaml
        git commit -m "chore(cd): update image tag to ${{ github.sha }} [skip ci]" || echo "No changes"
        git push