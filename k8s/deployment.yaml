apiVersion: apps/v1
kind: Deployment
metadata:
  name: exco-deployment
  namespace: exco-prod
  labels:
    app: exco-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exco-service
  template:
    metadata:
      labels:
        app: exco-service
    spec:
      containers:
      - name: exco-app
        image: ofekh/exco-app:2c8fe5b220569942cde1f4f9c0b386cac6a5023c
        imagePullPolicy: Always
        ports:
        - containerPort: 8080