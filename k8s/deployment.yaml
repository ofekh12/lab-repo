apiVersion: apps/v1
kind: Deployment
metadata:
  name: exco-deployment
  namespace: exco-prod
  labels:
    app: exco-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exco-service
  template:
    metadata:
      labels:
        app: exco-service
    spec:
      containers:
      - name: exco-app
        image: ofekh/exco-app:92f5f5de63b753ebda413a1fc8731c47653dc712
        imagePullPolicy: Always
        ports:
        - containerPort: 8080